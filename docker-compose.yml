services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 15s
      retries: 10
      start_period: 20s

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - |
        mongosh --host mongo:27017 --quiet --eval '
          try {
            rs.status();
            print("replica set already initiated");
          } catch (e) {
            rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]});
            print("replica set initiated");
          }
        '

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import

  backend:
    build: .
    command: ["uvicorn", "cde.api:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      MONGODB_URI: "mongodb://mongo:27017/?replicaSet=rs0"
      MONGODB_DB_NAME: cde_db
      KEYCLOAK_SERVER_URL: "http://keycloak:8080"
      KEYCLOAK_REALM: cde
      KEYCLOAK_CLIENT_ID: cde-api
      KEYCLOAK_WEB_CLIENT_ID: cde-web
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_DIAGNOSTIC_MODEL: "${GEMINI_DIAGNOSTIC_MODEL:-gemini-3.1-flash-lite}"
      CDE_VERIFIED_CROP_ROOT: "/app/verified_storage"
      CDE_DIAGNOSTIC_TIMEOUT_SECONDS: "45"
    volumes:
      - verified_storage:/app/verified_storage

  worker:
    build: .
    command: ["python", "-m", "cde.jobs.worker"]
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    environment:
      MONGODB_URI: "mongodb://mongo:27017/?replicaSet=rs0"
      MONGODB_DB_NAME: cde_db
      KEYCLOAK_SERVER_URL: "http://keycloak:8080"
      KEYCLOAK_REALM: cde
      KEYCLOAK_CLIENT_ID: cde-api
      KEYCLOAK_WEB_CLIENT_ID: cde-web
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_DIAGNOSTIC_MODEL: "${GEMINI_DIAGNOSTIC_MODEL:-gemini-3.1-flash-lite}"
      CDE_VERIFIED_CROP_ROOT: "/app/verified_storage"
      CDE_DIAGNOSTIC_TIMEOUT_SECONDS: "45"
    volumes:
      - verified_storage:/app/verified_storage

volumes:
  mongo_data:
  verified_storage:
